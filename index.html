<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigma Gallery - Downloads</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .status-msg {
      font-size: 0.9rem;
      color: #38bdf8;
      margin-bottom: 24px;
      padding: 10px;
      background-color: rgba(56, 189, 248, 0.1);
      border-radius: 8px;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }
    .btn-apk {
      background-color: #22c55e;
      color: #052e16;
    }
    .btn-apk:hover {
      background-color: #16a34a;
    }
    .btn-exe {
      background-color: #3b82f6;
      color: #1e3a8a;
    }
    .btn-exe:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Sigma Gallery Downloads</h1>
    <p id="instruction-text">Select your platform below if your download does not start automatically.</p>

    <div id="status" class="status-msg" style="display: none;"></div>

    <div class="button-group">
      <a href="SigmaGallery.apk" download class="btn btn-apk">Download Android (.APK)</a>
      <a href="SigmaGallery.exe" download class="btn btn-exe">Download Windows (.EXE)</a>
    </div>
  </div>

  <script>
    // File names matching your repository root files
    const APK_FILE = "SigmaGallery.apk";
    const EXE_FILE = "SigmaGallery.exe";

    function triggerDownload(filePath, label) {
      document.getElementById("status").style.display = "block";
      document.getElementById("status").innerText = "Downloading " + label + " automatically...";
      document.getElementById("instruction-text").style.display = "none";

      const a = document.createElement("a");
      a.href = filePath;
      a.download = filePath.split('/').pop();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Check query parameters (?file=apk) or hashes (#apk)
    const params = new URLSearchParams(window.location.search);
    const fileParam = params.get('file')?.toLowerCase();
    const hash = window.location.hash.toLowerCase();

    if (fileParam === 'apk' || hash === '#apk') {
      triggerDownload(APK_FILE, "Android APK");
    } else if (fileParam === 'exe' || hash === '#exe') {
      triggerDownload(EXE_FILE, "Windows EXE");
    }
  </script>

</body>
</html>
