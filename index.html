<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigma Gallery - Downloads</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .status-msg {
      font-size: 0.9rem;
      color: #38bdf8;
      margin-bottom: 24px;
      padding: 12px;
      background-color: rgba(56, 189, 248, 0.1);
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-apk {
      background-color: #22c55e;
      color: #052e16;
    }
    .btn-apk:hover {
      background-color: #16a34a;
    }
    .btn-exe {
      background-color: #3b82f6;
      color: #1e3a8a;
    }
    .btn-exe:hover {
      background-color: #2563eb;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Sigma Gallery Downloads</h1>
    <p id="desc-text">Get the latest version for your platform below.</p>

    <div id="status" class="status-msg hidden"></div>

    <div id="download-container">
      <!-- Buttons will be dynamically shown or highlighted based on URL parameters -->
      <a id="apk-btn" href="SigmaGallery.apk" download class="btn btn-apk">Download Android (.APK)</a>
      <a id="exe-btn" href="SigmaGallery.exe" download class="btn btn-exe hidden">Download Windows (.EXE)</a>
    </div>
  </div>

  <script>
    const APK_FILE = "SigmaGallery.apk";
    const EXE_FILE = "SigmaGallery.exe";

    const params = new URLSearchParams(window.location.search);
    const fileParam = params.get('file')?.toLowerCase();
    const hash = window.location.hash.toLowerCase();

    const statusEl = document.getElementById("status");
    const apkBtn = document.getElementById("apk-btn");
    const exeBtn = document.getElementById("exe-btn");
    const descText = document.getElementById("desc-text");

    let targetFile = "";
    let label = "";

    if (fileParam === 'apk' || hash === '#apk') {
      targetFile = APK_FILE;
      label = "Android APK";
      apkBtn.classList.remove("hidden");
      exeBtn.classList.add("hidden");
    } else if (fileParam === 'exe' || hash === '#exe') {
      targetFile = EXE_FILE;
      label = "Windows EXE";
      exeBtn.classList.remove("hidden");
      apkBtn.classList.add("hidden");
    }

    if (targetFile) {
      descText.style.display = "none";
      statusEl.style.display = "block";
      statusEl.innerHTML = `Your download for <strong>${label}</strong> should begin shortly.<br><small style="color:#94a3b8; display:block; margin-top:6px;">If it doesn't start automatically, click the button below.</small>`;

      // Attempt programmatic download (may be blocked by browser popup blockers)
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          const a = document.createElement("a");
          a.href = targetFile;
          a.download = targetFile;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, 500);
      });
    }
  </script>

</body>
</html>
