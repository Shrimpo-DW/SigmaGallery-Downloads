<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigma Gallery - Downloads</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #ffffff;
      border: 2px solid #000000;
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 6px 6px 0px #000000;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: #000000;
      font-weight: 800;
    }
    p {
      color: #555555;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .status-msg {
      font-size: 0.9rem;
      color: #000000;
      margin-bottom: 24px;
      padding: 12px;
      background-color: #f3f4f6;
      border: 1px solid #000000;
      border-radius: 6px;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      border: 2px solid #000000;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-apk, .btn-exe {
      background-color: #000000;
      color: #ffffff;
    }
    .btn-apk:hover, .btn-exe:hover {
      background-color: #333333;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Sigma Gallery Downloads</h1>
    <p id="desc-text">Get the latest version for your platform below.</p>

    <div id="status" class="status-msg hidden"></div>

    <div class="button-group" id="button-container">
      <a id="apk-btn" href="SigmaGallery.apk" download class="btn btn-apk">Download Android (.APK)</a>
      <a id="exe-btn" href="SigmaGallery.exe" download class="btn btn-exe hidden">Download Windows (.EXE)</a>
    </div>
  </div>

  <script>
    const APK_FILE = "SigmaGallery.apk";
    const EXE_FILE = "SigmaGallery.exe";

    const params = new URLSearchParams(window.location.search);
    const fileParam = params.get('file')?.toLowerCase();
    const hash = window.location.hash.toLowerCase();

    const statusEl = document.getElementById("status");
    const apkBtn = document.getElementById("apk-btn");
    const exeBtn = document.getElementById("exe-btn");
    const descText = document.getElementById("desc-text");

    let targetFile = "";
    let label = "";

    if (fileParam === 'apk' || hash === '#apk') {
      targetFile = APK_FILE;
      label = "Android APK";
      apkBtn.classList.remove("hidden");
      exeBtn.classList.add("hidden");
    } else if (fileParam === 'exe' || hash === '#exe') {
      targetFile = EXE_FILE;
      label = "Windows EXE";
      exeBtn.classList.remove("hidden");
      apkBtn.classList.add("hidden");
    }

    if (targetFile) {
      descText.style.display = "none";
      statusEl.style.display = "block";
      statusEl.innerHTML = `Your download for <strong>${label}</strong> should begin shortly.<br><small style="color:#666666; display:block; margin-top:6px;">If it doesn't start automatically, click the button below.</small>`;

      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          const a = document.createElement("a");
          a.href = targetFile;
          a.download = targetFile;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, 500);
      });
    }
  </script>

</body>
</html>
